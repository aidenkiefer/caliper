[tool.poetry]
name = "polymarket-service"
version = "0.1.0"
description = "Polymarket BTC hourly market-making service for the Caliper trading platform"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "polymarket", from = ".."}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
py-clob-client = ">=0.9.0"
web3 = "^6.0.0"
eth-account = "^0.10.0"
httpx = "^0.26.0"
websockets = "^12.0"
asyncpg = "^0.29.0"
sqlalchemy = "^2.0.25"
structlog = "^24.1.0"
python-dotenv = "^1.0.0"
typer = ">=0.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"

[tool.poetry.scripts]
polymarket-session = "polymarket.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
